services:
  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - THREAT_SUMMARY_EVERY_N_TX=${THREAT_SUMMARY_EVERY_N_TX:-15}
    ports:
      - "8000:8000"
    depends_on:
      - valkey
